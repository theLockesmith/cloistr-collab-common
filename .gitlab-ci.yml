stages:
  - build
  - test
  - publish
  - trigger

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/cloistr-rules.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/npm-publish.yml'

variables:
  NODE_VERSION: "22"

# Build and type-check
#
# `extends: .cloistr-rules` is load-bearing here for the same reason the `test`
# job below carries it. Without it this job has no `rules:` and no `only:`, so it
# falls back to the legacy default `only: [branches, tags]` — and a merge-request
# pipeline is neither, so the job is NOT CREATED AT ALL, with no error and no
# skipped badge. Measured 2026-09-04 on merge request !42: pipeline 44267 created
# exactly one job, `test`. The typecheck this package publishes on never ran
# against that MR, only after it merged, which is backwards from the point of a
# gate. ~25 apps consume this package.
build:
  extends: .cloistr-rules
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# Publish to GitLab npm registry

# These packages PUBLISHED UNTESTED until this landed: the pipeline ran
# `npm ci && npm run build`, which is typecheck + tsc, and no suite at all.
# Green meant "it compiled". @cloistr/ui alone has 16 consumers.
#
# `extends: .cloistr-rules` is load-bearing, not decoration — without it this
# job silently does not exist in a merge-request pipeline (see the template's
# own comment), so the gate would fire only AFTER merge, which is backwards.
test:
  extends: .cloistr-rules
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci
    - npm test
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

publish:
  extends: .npm-publish
  variables:
    NPM_PUBLISH_FLAGS: ""
  dependencies:
    - build
  only:
    - master
    - tags

trigger-renovate:
  stage: trigger
  needs: ["publish"]
  trigger:
    project: coldforge/ci-templates
    branch: main
  only:
    - master
    - tags
