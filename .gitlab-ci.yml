stages:
  - test
  - build
  - publish
  - trigger

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/npm-publish.yml'

variables:
  NODE_VERSION: "22"

# This package auto-publishes to the npm registry on EVERY push to master, and
# ~25 apps consume it. Without this stage a broken change ships to all of them
# the moment it merges. `vitest` alone is watch mode and hangs CI, hence --run.
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci
    - npx vitest run
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# Build and type-check
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# Publish to GitLab npm registry
publish:
  extends: .npm-publish
  variables:
    NPM_PUBLISH_FLAGS: ""
  dependencies:
    - build
  only:
    - master
    - tags

trigger-renovate:
  stage: trigger
  needs: ["publish"]
  trigger:
    project: coldforge/ci-templates
    branch: main
  only:
    - master
    - tags
